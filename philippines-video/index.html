<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=1080,H=1920;
const BLUE='#0038A8', NAVY='#021a4a', RED='#CE1126', YELLOW='#FCD116', WHITE='#ffffff';
const TAU=Math.PI*2;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eoc=t=>{t=clamp(t);return 1-Math.pow(1-t,3);};
const eioc=t=>{t=clamp(t);return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const eob=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};

function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function bgGrad(c1,c2){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function vignette(s){const g=ctx.createRadialGradient(W/2,H*0.42,H*0.1,W/2,H*0.5,H*0.78);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+s+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function text(str,x,y,size,weight,color,align,ls,alpha,maxW){
 align=align||'center';ls=ls||0;alpha=(alpha==null?1:alpha);maxW=maxW||W*0.9;
 if(alpha<=0)return;
 ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';
 ctx.letterSpacing=ls+'px';
 let fs=size;ctx.font=weight+' '+fs+'px Inter, sans-serif';
 let guard=0;while(ctx.measureText(str).width>maxW&&fs>10&&guard++<200){fs-=2;ctx.font=weight+' '+fs+'px Inter, sans-serif';}
 ctx.shadowColor='rgba(0,0,0,0.35)';ctx.shadowBlur=18;ctx.shadowOffsetY=6;
 ctx.fillText(str,x,y);
 ctx.restore();
}
function sA(lt,dur,fin,fout){fin=fin||0.6;fout=(fout==null?0.5:fout);const fi=clamp(lt/fin),fo=(fout<=0?1:clamp((dur-lt)/fout));return eioc(Math.min(fi,fo));}

function drawStar(cx,cy,r,rot,alpha,color){
 ctx.save();ctx.globalAlpha=alpha;ctx.translate(cx,cy);ctx.rotate(rot==null?-Math.PI/2:rot);ctx.fillStyle=color||YELLOW;
 ctx.beginPath();
 for(let i=0;i<5;i++){const ao=i*TAU/5;ctx.lineTo(Math.cos(ao)*r,Math.sin(ao)*r);const ai=ao+Math.PI/5;ctx.lineTo(Math.cos(ai)*r*0.42,Math.sin(ai)*r*0.42);}
 ctx.closePath();ctx.fill();ctx.restore();
}
function drawSun(cx,cy,R,rot,alpha){
 if(R<=1)return;
 ctx.save();ctx.globalAlpha=alpha;ctx.translate(cx,cy);ctx.rotate(rot);ctx.fillStyle=YELLOW;
 const len=R*1.25,hw=R*0.15,base=-R*0.78;
 for(let i=0;i<8;i++){
  ctx.save();ctx.rotate(i*TAU/8);
  ctx.beginPath();ctx.moveTo(0,base-len);ctx.lineTo(-hw,base);ctx.lineTo(hw,base);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(0,base-len*0.68);ctx.lineTo(-hw*2.6,base);ctx.lineTo(-hw*1.1,base);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(0,base-len*0.68);ctx.lineTo(hw*2.6,base);ctx.lineTo(hw*1.1,base);ctx.closePath();ctx.fill();
  ctx.restore();
 }
 ctx.beginPath();ctx.arc(0,0,R*0.78,0,TAU);ctx.fill();
 ctx.restore();
}
function drawEmblem(cx,cy,R,rot,alpha){
 if(R<=1)return;
 drawSun(cx,cy,R,rot,alpha);
 const sr=R*0.3,d=R*1.95;
 const angs=[-Math.PI/2,Math.PI/6,Math.PI*5/6];
 for(const a of angs){drawStar(cx+Math.cos(a)*d,cy+Math.sin(a)*d,sr,-Math.PI/2,alpha,YELLOW);}
}
function drawHeart(cx,cy,s,color,alpha){
 ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.translate(cx,cy);ctx.scale(s/90,s/90);
 ctx.beginPath();ctx.moveTo(0,45);
 ctx.bezierCurveTo(-70,-15,-65,-70,-25,-70);
 ctx.bezierCurveTo(-8,-70,0,-52,0,-42);
 ctx.bezierCurveTo(0,-52,8,-70,25,-70);
 ctx.bezierCurveTo(65,-70,70,-15,0,45);
 ctx.closePath();ctx.fill();ctx.restore();
}
function drawJeepney(x,y,alpha){
 ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);
 ctx.fillStyle='#160205';
 roundRect(-190,-95,380,115,22);ctx.fill();
 roundRect(-150,-150,300,70,16);ctx.fill();
 ctx.fillStyle=YELLOW;
 for(let i=0;i<5;i++){roundRect(-132+i*58,-140,44,46,6);ctx.fill();}
 ctx.fillStyle='#ffe27a';roundRect(150,-70,34,40,6);ctx.fill();
 ctx.fillStyle='#0a0102';
 ctx.beginPath();ctx.arc(-115,32,44,0,TAU);ctx.fill();
 ctx.beginPath();ctx.arc(115,32,44,0,TAU);ctx.fill();
 ctx.fillStyle='#444';
 ctx.beginPath();ctx.arc(-115,32,18,0,TAU);ctx.fill();
 ctx.beginPath();ctx.arc(115,32,18,0,TAU);ctx.fill();
 ctx.restore();
}

const P=[];for(let i=0;i<28;i++){P.push({x:Math.random(),y:Math.random(),r:Math.random(),s:0.2+Math.random()*0.6});}
function particles(t,color){ctx.save();ctx.fillStyle=color;for(const p of P){const y=((p.y-t*p.s*0.03)%1+1)%1;ctx.beginPath();ctx.arc(p.x*W,y*H,4+p.r*14,0,TAU);ctx.fill();}ctx.restore();}

const ISL=[];(function(){const cols=['#1f7a3d','#2e9e52','#38b36a','#176b36'];for(let i=0;i<26;i++){let x,y;let g=0;do{x=0.08+Math.random()*0.84;y=0.08+Math.random()*0.84;g++;}while(y>0.33&&y<0.63&&g<30);ISL.push({x:x*W,y:y*H,r:10+Math.random()*26,delay:Math.random()*1.4,ph:Math.random()*TAU,c:cols[(Math.random()*cols.length)|0]});}})();

const CONF=[];const cc=[YELLOW,WHITE,'#ff5a5f','#ffd700','#00d1ff'];for(let i=0;i<42;i++){CONF.push({x:Math.random(),y:Math.random()*1.2,s:0.14+Math.random()*0.26,rot:(Math.random()-0.5)*4,ph:Math.random()*TAU,c:cc[(Math.random()*cc.length)|0]});}

function intro(lt,dur){
 bgGrad('#001233',BLUE);particles(lt,'rgba(255,255,255,0.06)');
 const A=sA(lt,dur);
 const s=eob(clamp(lt/1.1));
 drawEmblem(W/2,H*0.32,150*s,lt*0.15,A);
 const tv=eoc(clamp((lt-0.6)/0.9));
 text('PHILIPPINES',W/2,H*0.57,130,'800',WHITE,'center',4,A*tv,W*0.9);
 ctx.save();ctx.globalAlpha=A*tv;ctx.fillStyle=YELLOW;const uw=lerp(0,360,eoc(clamp((lt-1.1)/0.8)));ctx.fillRect(W/2-uw/2,H*0.625,uw,8);ctx.restore();
 text('Pearl of the Orient Seas',W/2,H*0.68,46,'500','rgba(255,255,255,0.92)','center',6,A*eoc(clamp((lt-1.4)/0.9)));
}
function islands(lt,dur){
 bgGrad('#00235c','#004a9f');
 const A=sA(lt,dur);
 for(const d of ISL){const pop=eob(clamp((lt-0.2-d.delay)/0.6));if(pop<=0)continue;ctx.save();ctx.globalAlpha=A*clamp(pop);ctx.fillStyle=d.c;const rr=d.r*clamp(pop);ctx.beginPath();ctx.ellipse(d.x,d.y+Math.sin(lt*1.2+d.ph)*4,rr,rr*0.6,0,0,TAU);ctx.fill();ctx.restore();}
 const val=Math.round(lerp(0,7641,eoc(clamp((lt-0.3)/1.8))));
 text(val.toLocaleString('en-US'),W/2,H*0.42,200,'800',YELLOW,'center',2,A);
 text('ISLANDS',W/2,H*0.52,96,'800',WHITE,'center',16,A);
 text('One breathtaking archipelago',W/2,H*0.575,42,'500','rgba(255,255,255,0.9)','center',3,A*eoc(clamp((lt-1)/0.8)));
}
function drawWaves(t,baseY,color,alpha,phase,amp){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=18){const y=baseY+Math.sin((x/W)*TAU*2+t*1.5+phase)*amp*0.3+Math.sin((x/W)*TAU*5+t*2)*amp*0.1;ctx.lineTo(x,y);}ctx.lineTo(W,H);ctx.closePath();ctx.fill();ctx.restore();}
function beaches(lt,dur){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8fe8ff');g.addColorStop(0.45,'#35c2e6');g.addColorStop(0.46,'#0a9bc4');g.addColorStop(1,'#026a94');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const A=sA(lt,dur);
 ctx.save();ctx.globalAlpha=A*0.95;ctx.fillStyle='#fff1b4';ctx.beginPath();ctx.arc(W*0.74,H*0.2,120,0,TAU);ctx.fill();ctx.restore();
 drawWaves(lt,H*0.54,'#1fb0d6',A*0.9,0,70);
 drawWaves(lt,H*0.62,'#0e94bd',A*0.95,1.5,90);
 drawWaves(lt,H*0.72,'#036a92',A,3,120);
 ctx.save();ctx.globalAlpha=A;ctx.fillStyle='#f6e4b8';ctx.fillRect(0,H*0.88,W,H*0.12);ctx.restore();
 text('PRISTINE BEACHES',W/2,H*0.32,92,'800',WHITE,'center',3,A);
 text('Crystal waters & powder-white sand',W/2,H*0.38,40,'600','#eafaff','center',2,A*eoc(clamp((lt-0.8)/0.8)));
}
function culture(lt,dur){
 bgGrad('#7a0d16','#c0161f');
 const A=sA(lt,dur);
 for(const c of CONF){const y=((c.y+lt*c.s)%1.2-0.1);ctx.save();ctx.globalAlpha=A*0.9;ctx.translate(c.x*W,y*H);ctx.rotate(lt*c.rot+c.ph);ctx.fillStyle=c.c;ctx.fillRect(-10,-6,20,12);ctx.restore();}
 drawJeepney(lerp(-320,W+320,eioc(clamp(lt/dur))),H*0.76,A*0.97);
 text('VIBRANT CULTURE',W/2,H*0.32,92,'800',WHITE,'center',3,A);
 text('Fiestas, music & living heritage',W/2,H*0.38,40,'600','#ffe6e8','center',2,A*eoc(clamp((lt-0.8)/0.8)));
}
function hospitality(lt,dur){
 bgGrad('#f0a500','#f7c948');
 const A=sA(lt,dur);
 drawHeart(W/2,H*0.33,160*(1+Math.sin(lt*3)*0.04),RED,A);
 text('WARM HOSPITALITY',W/2,H*0.52,90,'800','#4a1a00','center',3,A);
 text("It's More Fun in the",W/2,H*0.6,52,'600','#5a2600','center',2,A*eoc(clamp((lt-0.8)/0.8)));
 text('PHILIPPINES!',W/2,H*0.655,66,'800',RED,'center',5,A*eoc(clamp((lt-1.1)/0.8)));
}
function outro(lt,dur){
 bgGrad('#001233',NAVY);
 const A=sA(lt,dur,0.6,0.6);
 const x0=0,y0=H*0.1,pw=W,ph=H*0.42;
 const slide=eoc(clamp(lt/1.0));
 ctx.save();ctx.globalAlpha=A;
 ctx.save();ctx.beginPath();roundRect(x0,y0,pw,ph,10);ctx.clip();
 const blueY=lerp(y0-ph/2,y0,slide);ctx.fillStyle=BLUE;ctx.fillRect(x0,blueY,pw,ph/2);
 const redY=lerp(y0+ph,y0+ph/2,slide);ctx.fillStyle=RED;ctx.fillRect(x0,redY,pw,ph/2);
 const triX=lerp(-pw,0,eoc(clamp((lt-0.15)/1.0)));
 ctx.save();ctx.translate(triX,0);ctx.fillStyle=WHITE;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0,y0+ph);ctx.lineTo(x0+ph*0.78,y0+ph/2);ctx.closePath();ctx.fill();
 const ea=clamp((lt-0.9)/0.6);drawEmblem(x0+ph*0.28,y0+ph/2,54,0,ea);ctx.restore();
 ctx.restore();ctx.restore();
 const show=clamp((lt-1.3)/0.8);
 if(show>0){ctx.save();ctx.globalAlpha=A*eoc(show);ctx.translate(W/2,H*0.68);const scv=eob(clamp(show));ctx.scale(scv,scv);text('MABUHAY!',0,0,150,'800',YELLOW,'center',4,1,W*0.86);ctx.restore();}
 text('Discover the Philippines',W/2,H*0.76,48,'500','rgba(255,255,255,0.92)','center',6,A*eoc(clamp((lt-1.8)/0.8)));
}

window.renderFrame=function(t){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 if(t<4.8)intro(t,4.8);
 else if(t<9.4)islands(t-4.8,4.6);
 else if(t<14.0)beaches(t-9.4,4.6);
 else if(t<18.5)culture(t-14.0,4.5);
 else if(t<23.0)hospitality(t-18.5,4.5);
 else outro(t-23.0,7.0);
 vignette(0.28);
};
window.ready=false;
(async()=>{try{await document.fonts.load('800 130px Inter');await document.fonts.load('600 52px Inter');await document.fonts.load('500 46px Inter');await document.fonts.ready;}catch(e){}window.renderFrame(0);window.ready=true;})();
</script></body></html>
